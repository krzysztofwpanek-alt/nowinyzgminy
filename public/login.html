<meta name="robots" content="noindex,nofollow"><title>[TEST] Logowanie</title><link rel="stylesheet" href="/site.css"><script src="/site.js" defer></script><script>try{var t=localStorage.getItem("nz-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script><style>.login #p{width:100%;font:16px Lato,system-ui,sans-serif;padding:11px 12px;border:1px solid #dde3e7;border-radius:8px}.login label.sp{display:flex;gap:8px;align-items:center;font-weight:400;margin:10px 0 0}.login label.sp input{width:auto}</style></head>
<body><div class="testbar">STRONA TESTOWA – makieta propozycji dla Zarządu. To nie jest oficjalna strona GWŻ w Warszawie.<span class="ux" role="group" aria-label="Wybór układu graficznego">Układ graficzny <button data-t="" aria-pressed="false">1</button><button data-t="b" aria-pressed="false">2</button><button data-t="c" aria-pressed="false">3</button><button data-t="d" aria-pressed="false">4</button><button data-t="e" aria-pressed="false">5</button></span></div><div class="wm" aria-hidden="true"></div>
<header class="site"><div class="hin"><span class="brand"><img class="logo" src="/assets/logo-poziom.svg" alt="Gmina Wyznaniowa Żydowska w Warszawie"></span></div></header>
<main><form class="login" method="post" action="/api/login"><h1 style="font-size:24px;margin-top:0">Strefa członka</h1>
<div id="e"></div><label for="p">Hasło</label><input id="p" name="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required autofocus><label class="sp"><input type="checkbox" id="sp"> Pokaż hasło</label>
<input type="hidden" name="next" id="n" value="/"><button type="submit">Zaloguj</button></form></main>
<footer class="site">Strona testowa. To nie jest oficjalna strona GWŻ w Warszawie.</footer>
<script>document.getElementById('sp').addEventListener('change',function(){document.getElementById('p').type=this.checked?'text':'password'});var q=new URLSearchParams(location.search);if(q.get('error'))document.getElementById('e').innerHTML='<p class="err">Nieprawidłowe hasło.</p>';var x=q.get('next');if(x&&x.indexOf('/')===0&&x.indexOf('//')!==0)document.getElementById('n').value=x;</script></body></html>
